# ProotOS boot configuration (INI)
#
# Paths are relative to the EFI system partition root.
kernel=\EFI\BOOT\KERNEL.ELF
initramfs=\EFI\BOOT\INITRAMFS.CPIO

# Requested GOP mode. The loader falls back to another mode if unavailable.
width=1280
height=720

# Kernel command line (parsed by the kernel / init in later milestones).
cmdline=console=serial,fb root=initramfs
